# ============================================================================
#  knowledge.yaml — KHO TRI THUC HOI-DAP cua Go (cho robot Go2).
#
#  Dung boi faq_matcher.py: cau hoi nguoi dung duoc so khop NGU NGHIA (fuzzy)
#  voi cac vi du 'q' o day -> tra ve 'a'. Nen KHONG can liet ke moi cach noi;
#  chi can vai cach noi tieu bieu, may fuzzy lo phan con lai (thieu dau, dao chu...).
#
#  Moi muc:
#    q: [danh sach vai cach hoi tieu bieu]   (CO hoac KHONG dau deu duoc)
#    a: "cau tra loi"                         (persona Go, ngan gon cho TTS doc)
#    action: ten_dong_tac                     (TUY CHON: hello/dance1/dance2/
#                                              stretch/heart/standup/standdown)
#
#  MO RONG: cu them muc moi vao duoi. Cang nhieu tinh huong -> cang thong minh.
#  Luu y: DUNG dat lenh dieu khien (di/xoay/nhay) o day - de reflex_matcher lo.
# ============================================================================

