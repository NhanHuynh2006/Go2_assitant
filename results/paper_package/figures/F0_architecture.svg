   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f1f1f" x="54.594231" y="26.113646" transform="rotate(-0 54.594231 26.113646)">Sensing</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(15.431965 36.06192)">2-D LiDAR scan, 10 Hz</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(26.033137 44.96417)">+ depth camera</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(26.437278 53.86642)">(±43°, 0.3–4 m)</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(27.837278 62.76867)">occupancy grid</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(25.548059 71.67092)">+ global A* path</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f1f1f" x="175.923462" y="26.113646" transform="rotate(-0 175.923462 26.113646)">Tracker v3 (shared)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(130.834165 36.06192)">clusters minus static map</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(129.794555 44.96417)">per-point motion evidence</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(147.595883 53.86642)">CV Kalman filter</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(141.433696 62.76867)">centroid shift 0.64 r</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(128.465102 71.67092)">stopped person kept ≤ 6 s,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(129.059555 80.57317)">tracks held when occluded</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f1f1f" x="340.855385" y="26.113646" transform="rotate(-0 340.855385 26.113646)">Risk-aware MPPI (C1, ours)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(269.777494 36.06192)">K = 600 Gaussian samples + 96 evasive</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(269.113041 44.96417)">primitives (16 dir. × 3 turns; full or 1.2 s)</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(266.375931 53.86642)">rollouts T = 24 × 0.1 s through RespModel</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(264.241478 62.76867)">cost = path/goal + static + graded collision</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(268.720931 71.67092)">+ geo risk  Σ_j max_t e^(−t/1.2) φ(d_j(t))</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(275.084369 80.767857)">(2-disc body vs. CV-predicted person)</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(273.852806 89.670107)">temperature λ = 0.3 (Q15(S) − min S)</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(276.632572 98.572357)">u = Σ_k w_k u_k,  w_k ∝ exp(−S_k/λ)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f1f1f" x="489.673269" y="26.113646" transform="rotate(-0 489.673269 26.113646)">~cs shaper</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(474.376082 36.06192)">optional,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(459.296004 44.96417)">deployment only:</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(464.647722 53.909295)">cap |wz| when</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(457.478191 63.006232)">strafing/reversing;</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(459.750457 71.908482)">rate limits vy, wz</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f1f1f" x="570.243462" y="26.113646" transform="rotate(-0 570.243462 26.113646)">Robot</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(557.642915 36.06192)">CHAMP</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(554.301508 44.96417)">(Gazebo)</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(553.744243 53.86642)">Isaac Lab</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(559.939243 62.76867)">policy</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(563.163071 71.67092)">Go2</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(550.714555 80.57317)">SportClient</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f1f1f" x="340.855385" y="181.801318" transform="rotate(-0 340.855385 181.801318)">RespModel (shared, online)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(266.111791 191.749591)">per axis: v = s·tanh(g·u/s) + first-order lag</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(288.897338 200.651841)">grid posterior over (g, s) from</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(276.440072 209.554091)">(command, measured velocity) pairs</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(285.792728 218.456341)">forward / reverse / lateral / yaw</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(286.661166 227.358591)">reads no simulator parameters</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f1f1f" x="120.946154" y="181.801318" transform="rotate(-0 120.946154 181.801318)">Evaluation tiers</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(37.453107 191.749591)">fastsim: virtual clock, unmodified planner code,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(52.773263 200.651841)">3 dynamics regimes × 2 crowd models</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(38.393185 209.554091)">Gazebo/CHAMP: separate pre-registered family</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(41.758654 218.456341)">Isaac Lab: independent body (learned policy)</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(84.402326 227.358591)">real Go2: not yet run</text>
   </g>
