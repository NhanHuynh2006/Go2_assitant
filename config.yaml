# ============================================================
#  config.yaml — DEMO chi noi tren JETSON (toi uu TOC DO)
# ============================================================

llm:
  endpoint: "http://127.0.0.1:8080"
  temperature: 0.2
  n_predict: 80                        # GIAM 200->80: cau lenh JSON ngan, sinh it token = nhanh
  timeout_s: 60
  fewshot: false                       # model DA FINE-TUNE

stt:
  backend: transducer
  transducer_model: /home/unitree/NhanHuynh/go2_jetson_demo/models/zipformer-vi-30M
  hotwords_file: /home/unitree/NhanHuynh/go2_jetson_demo/hotwords.txt
  hotwords_score: 3.0
  device: cpu

audio:
  backend: local
  input_device: "CS202"
  silence_end_ms: 200      # cat cau nhanh hon (270->200) -> phan hoi lien hon; neu bi cat giua cau thi tang lai
  mic_gain: 25             # % gain thu ALSA. 25 = diem ngot cua CS202 (100 = +32dB -> vo tieng, VAD truot cau)

robot:
  # dry_run: robot GIA (chi in lenh). De TRUE cho an toan; muon chay THAT thi
  # chay:  python3 assistant_realtime.py --mode voice --real   (co --real moi cu dong)
  dry_run: true
  iface: eth0
  # Toc do CHAM cho an toan khi demo (m/s, rad/s)
  max_vx: 0.3
  max_vy: 0.25
  max_vyaw: 0.8
  max_duration: 3.0
  # MOI: moi lenh di chuyen toi da ~0.5m (50cm) -> khoi di ca met, so dung do vat
  max_step_m: 0.5
  require_stand_before_move: true

tts:
  enabled: true
  output: robot                     # ← ra LOA ROBOT qua WebRTC
  speaker_port: 17891
  voice: /home/unitree/NhanHuynh/go2_jetson_demo/models/piper/vi/vi_VN/vais1000/medium/vi_VN-vais1000-medium.onnx
  piper_bin: /home/unitree/piper/piper
